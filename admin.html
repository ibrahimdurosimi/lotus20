<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LOTUS@20 Admin &middot; Moderation Desk</title>
<link rel="icon" type="image/png" href="/images/lc-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#EAEAEA;--soft:#F5F5F5;--white:#fff;--red:#C10202;--deep:#8F0101;--pink:#FFE1DC;--green:#1F9D55;
  --display:'Plus Jakarta Sans','Arial',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;--bw:3px;--sh:5px 5px 0 var(--ink)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--red);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.top{background:var(--white);border-bottom:var(--bw) solid var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:32px;width:auto;display:block;object-fit:contain}
.brand b{background:var(--red);color:var(--white);border:var(--bw) solid var(--ink);padding:1px 8px;font-weight:800}
.brand span{font-family:var(--mono);font-size:.72rem;font-weight:700;text-transform:uppercase;border:2px solid var(--ink);padding:3px 8px;background:var(--ink);color:var(--white)}
.top-nav{display:flex;align-items:center;gap:10px}
.who{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.74rem;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border:var(--bw) solid var(--ink);background:var(--white);padding:9px 14px;font-weight:800;font-size:.82rem;text-transform:uppercase;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;white-space:nowrap;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--white)}
.btn.ok{background:var(--green);color:var(--white)}
.btn.dark{background:var(--ink);color:var(--white);box-shadow:4px 4px 0 var(--red)}
.btn.sm{padding:6px 10px;font-size:.72rem;box-shadow:3px 3px 0 var(--ink)}
main{padding-block:clamp(20px,4vw,40px)}

/* login */
.login{max-width:440px;margin:clamp(24px,8vh,80px) auto;background:var(--white);border:var(--bw) solid var(--ink);box-shadow:10px 10px 0 var(--red);padding:28px}
.login h1{margin:0;font-weight:800;font-size:2rem;letter-spacing:-.04em;line-height:1}
.login h1 em{font-style:normal;color:var(--red)}
.login p{margin:10px 0 18px;font-weight:500}
label{display:block;font-family:var(--mono);font-size:.72rem;font-weight:700;text-transform:uppercase;margin:12px 0 6px}
input[type=email],input[type=password],input[type=search]{width:100%;border:var(--bw) solid var(--ink);padding:10px 12px;font-weight:600;background:var(--white);border-radius:0}
input:focus{outline:none;box-shadow:4px 4px 0 var(--red)}
.err{color:var(--red);font-weight:700;min-height:1.3em;margin:10px 0}
.login .btn{margin-top:6px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:14px 16px}
.stat b{display:block;font-weight:800;font-size:2rem;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:.68rem;font-weight:700;text-transform:uppercase}
.stat.alert{background:var(--red);color:var(--white)}

/* tabs + toolbar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;border:var(--bw) solid var(--ink);box-shadow:var(--sh);background:var(--white);flex-wrap:wrap}
.tab{border:none;background:none;padding:10px 16px;font-weight:800;text-transform:uppercase;font-size:.82rem;display:flex;align-items:center;gap:8px}
.tab+.tab{border-left:var(--bw) solid var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--white)}
.tab i{font-style:normal;font-family:var(--mono);font-size:.7rem;background:var(--red);color:var(--white);padding:1px 6px;border:2px solid var(--ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{width:220px;padding:8px 10px}
.updated{font-family:var(--mono);font-size:.68rem;font-weight:700;text-transform:uppercase;opacity:.7}

/* list */
.bulk{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:var(--mono);font-size:.74rem;font-weight:700;text-transform:uppercase}
.bulk input{width:18px;height:18px;accent-color:var(--red)}
.list{display:flex;flex-direction:column;gap:14px}
.note{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:16px}
.note.done{opacity:.5;pointer-events:none}
.note input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--red)}
.note .msg{font-weight:700;font-size:1.05rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.note .meta{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:.7rem;font-weight:700;text-transform:uppercase}
.note .meta .rel{color:var(--red)}
.note .acts{display:flex;flex-direction:column;gap:8px}
@media(max-width:640px){.note{grid-template-columns:auto minmax(0,1fr)}.note .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
.empty{background:var(--white);border:var(--bw) dashed var(--ink);padding:28px;text-align:center;font-weight:700}
.tbl{background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--sh);overflow-x:auto}
.row{display:grid;grid-template-columns:50px minmax(140px,1fr) 80px 80px 150px 110px;gap:10px;align-items:center;padding:10px 14px;border-top:2px solid var(--ink);min-width:640px}
.row:first-child{border-top:none}
.row.hd{background:var(--ink);color:var(--white);font-family:var(--mono);font-size:.68rem;font-weight:700;text-transform:uppercase}
.row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mono{font-family:var(--mono);font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums}
.row.hid{background:var(--soft);color:#777}
.row.hid .nm{text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--white);border:var(--bw) solid var(--ink);box-shadow:5px 5px 0 var(--red);padding:10px 16px;font-weight:700;z-index:50}
@media(max-width:640px){#whoEmail,.brand span{display:none}.tools input[type=search]{width:100%}.tools{width:100%}.tabs{width:100%}.tab{flex:1 1 auto}}
html,body{overflow-x:hidden}
.cfg{max-width:640px;margin:40px auto;background:var(--white);border:var(--bw) solid var(--ink);box-shadow:var(--sh);padding:24px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <img src="/images/20TH%20LOGO.png" alt="LOTUS Capital">
    <b>@20</b>
    <span>Admin</span>
  </div>
  <div class="top-nav">
    <a href="/" class="btn sm" title="Return to exhibition">&larr; Exhibition</a>
    <div class="who" id="who" hidden>
      <span id="whoEmail"></span>
      <button class="btn sm" id="logout" type="button">Sign out</button>
    </div>
  </div>
</div></header>

<main class="wrap">
  <!-- Login -->
  <section class="login" id="loginView" hidden>
    <h1>Moderation <em>desk</em></h1>
    <p>Sign in to approve notes for the LOTUS@20 wall and manage the quiz leaderboard.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="admin@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn dark" type="submit" id="loginBtn">Sign in &rarr;</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="appView" hidden>
    <div class="stats">
      <div class="stat" id="stPending"><b id="nPending">–</b><span>Notes awaiting approval</span></div>
      <div class="stat"><b id="nApproved">–</b><span>Notes on the wall</span></div>
      <div class="stat"><b id="nPlays">–</b><span>Quiz plays</span></div>
      <div class="stat"><b id="nAvg">–</b><span>Average score / 20</span></div>
    </div>

    <div class="bar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-t="pending" aria-selected="true">Pending <i id="tPending">0</i></button>
        <button class="tab" role="tab" data-t="approved" aria-selected="false">On the wall</button>
        <button class="tab" role="tab" data-t="scores" aria-selected="false">Leaderboard</button>
      </div>
      <div class="tools">
        <input type="search" id="q" placeholder="Search names or text" aria-label="Search">
        <button class="btn sm" id="refresh" type="button">Refresh</button>
        <span class="updated" id="updated"></span>
      </div>
    </div>

    <div class="bulk" id="bulk">
      <label style="margin:0;display:flex;align-items:center;gap:8px"><input type="checkbox" id="selAll"> Select all</label>
      <button class="btn sm ok" id="bulkApprove" type="button" disabled>Approve selected</button>
      <button class="btn sm red" id="bulkReject" type="button" disabled>Reject selected</button>
    </div>
    <div id="panel"></div>
  </section>

  <section class="cfg" id="cfgView" hidden>
    <h2>Setup needed</h2>
    <p>Add the Supabase URL and anon key near the top of the script in this file.</p>
  </section>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  /* ===== config ===== */
  var SUPABASE_URL='https://phfvkmmlpwsnscnryrth.supabase.co';
  var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoZnZrbW1scHdzbnNjbnJ5cnRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjMwMjEsImV4cCI6MjEwNjIzOTAyMX0.-KlxAF4UQCio5fS7liNTV0uFKyZrfDVi0Dqr-EvcoBU';

  var $=function(id){return document.getElementById(id);};
  var session=null,tab='pending',notes=[],scores=[],timer=null;
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2600);}
  function when(iso){var d=new Date(iso);return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});}
  function mmss(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

  /* ===== auth (Supabase REST) ===== */
  function saveSession(s){session=s;try{if(s)sessionStorage.setItem('lotus20admin',JSON.stringify(s));else sessionStorage.removeItem('lotus20admin');}catch(e){}}
  function loadSession(){try{return JSON.parse(sessionStorage.getItem('lotus20admin')||'null');}catch(e){return null;}}
  function auth(grant,body){
    return fetch(SUPABASE_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error_description||j.msg||'Sign-in failed');return j;});})
      .then(function(j){var s={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,email:j.user&&j.user.email};saveSession(s);return s;});
  }
  function fresh(){
    if(!session)return Promise.reject(new Error('signed out'));
    if(Date.now()<session.exp)return Promise.resolve(session);
    return auth('refresh_token',{refresh_token:session.refresh});
  }
  function api(path,opt){
    opt=opt||{};
    return fresh().then(function(s){
      return fetch(SUPABASE_URL+'/rest/v1/'+path,{method:opt.method||'GET',
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+s.access,'Content-Type':'application/json','Prefer':opt.prefer||'return=representation'},
        body:opt.body?JSON.stringify(opt.body):undefined});
    }).then(function(r){
      if(r.status===401){signOut();throw new Error('Your session expired. Please sign in again.');}
      if(!r.ok)return r.text().then(function(t){throw new Error(t||('Request failed ('+r.status+')'));});
      return r.status===204?[]:r.json();
    });
  }

  /* ===== views ===== */
  function show(v){$('loginView').hidden=v!=='login';$('appView').hidden=v!=='app';$('cfgView').hidden=v!=='cfg';$('who').hidden=v!=='app';}
  function signOut(){saveSession(null);clearInterval(timer);show('login');$('password').value='';}
  $('logout').addEventListener('click',signOut);

  $('loginForm').addEventListener('submit',function(e){
    e.preventDefault();
    var em=$('email').value.trim(),pw=$('password').value;
    if(!em||!pw){$('loginErr').textContent='Enter your email and password.';return;}
    $('loginErr').textContent='';$('loginBtn').disabled=true;$('loginBtn').textContent='Signing in…';
    auth('password',{email:em,password:pw}).then(start).catch(function(err){$('loginErr').textContent=/invalid/i.test(err.message)?'That email and password don’t match.':err.message;})
      .then(function(){$('loginBtn').disabled=false;$('loginBtn').innerHTML='Sign in &rarr;';});
  });

  function start(){
    // confirm this account is on the admin list
    return api('rpc/is_admin',{method:'POST',body:{}}).then(function(ok){
      if(ok!==true){signOut();$('loginErr').textContent='This account is not on the LOTUS@20 admin list.';return;}
      $('whoEmail').textContent=session.email||'';show('app');load();
      clearInterval(timer);timer=setInterval(load,60000);
    });
  }

  /* ===== data ===== */
  function load(){
    return Promise.all([
      api('notes?select=id,name,relationship,message,approved,created_at&order=created_at.desc&limit=1000'),
      api('quiz_scores?select=id,name,score,seconds,hidden,created_at&order=score.desc,seconds.asc,created_at.asc&limit=1000')
    ]).then(function(r){
      notes=r[0]||[];scores=r[1]||[];stats();render();
      $('updated').textContent='Updated '+new Date().toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
    }).catch(function(err){toast(err.message.slice(0,140));});
  }
  function stats(){
    var p=notes.filter(function(n){return !n.approved;}).length,a=notes.length-p;
    $('nPending').textContent=p;$('tPending').textContent=p;$('nApproved').textContent=a;
    $('stPending').classList.toggle('alert',p>0);
    $('nPlays').textContent=scores.length;
    $('nAvg').textContent=scores.length?(scores.reduce(function(s,x){return s+x.score;},0)/scores.length).toFixed(1):'–';
  }
  function filterText(list,keys){
    var q=$('q').value.trim().toLowerCase();if(!q)return list;
    return list.filter(function(x){return keys.some(function(k){return String(x[k]||'').toLowerCase().indexOf(q)>-1;});});
  }
  function render(){
    document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.t===tab?'true':'false');});
    $('bulk').hidden=tab!=='pending';$('selAll').checked=false;updBulk();
    var panel=$('panel');
    if(tab==='scores'){
      var list=filterText(scores,['name']);
      if(!list.length){panel.innerHTML='<div class="empty">No quiz scores yet.</div>';return;}
      var rank=0;
      panel.innerHTML='<div class="tbl"><div class="row hd"><span>Rank</span><span>Name</span><span>Score</span><span>Time</span><span>Played</span><span></span></div>'+
        list.map(function(s){if(!s.hidden)rank++;return '<div class="row'+(s.hidden?' hid':'')+'"><span class="mono">'+(s.hidden?'–':rank)+'</span><span class="nm">'+esc(s.name)+'</span><span class="mono">'+s.score+'/20</span><span class="mono">'+mmss(s.seconds)+'</span><span class="mono" style="font-size:.7rem">'+when(s.created_at)+'</span>'+
          '<span><button class="btn sm'+(s.hidden?'':' red')+'" data-hide="'+s.id+'" data-v="'+(s.hidden?'0':'1')+'">'+(s.hidden?'Show':'Hide')+'</button></span></div>';}).join('')+'</div>';
      panel.querySelectorAll('[data-hide]').forEach(function(b){b.addEventListener('click',function(){setHidden(b.dataset.hide,b.dataset.v==='1',b);});});
      return;
    }
    var approved=tab==='approved';
    var list2=filterText(notes.filter(function(n){return !!n.approved===approved;}),['name','message','relationship']);
    if(!list2.length){panel.innerHTML='<div class="empty">'+(approved?'No notes on the wall yet.':'All caught up. No notes waiting for approval.')+'</div>';return;}
    panel.innerHTML='<div class="list">'+list2.map(function(n){
      return '<div class="note" data-id="'+n.id+'">'+(approved?'<span></span>':'<input type="checkbox" class="pick" aria-label="Select note from '+esc(n.name)+'">')+
        '<div><div class="msg">&ldquo;'+esc(n.message)+'&rdquo;</div><div class="meta"><span>'+esc(n.name)+'</span><span class="rel">'+esc(n.relationship)+'</span><span>'+when(n.created_at)+'</span></div></div>'+
        '<div class="acts">'+(approved?'<button class="btn sm" data-act="unpublish">Take off wall</button><button class="btn sm red" data-act="delete">Delete</button>':'<button class="btn sm ok" data-act="approve">Approve</button><button class="btn sm red" data-act="delete">Reject</button>')+'</div></div>';
    }).join('')+'</div>';
    panel.querySelectorAll('.note').forEach(function(el){
      el.querySelectorAll('[data-act]').forEach(function(b){b.addEventListener('click',function(){act([el.dataset.id],b.dataset.act);});});
      var pk=el.querySelector('.pick');if(pk)pk.addEventListener('change',updBulk);
    });
  }
  function picked(){return [].map.call(document.querySelectorAll('.pick:checked'),function(c){return c.closest('.note').dataset.id;});}
  function updBulk(){var n=picked().length;$('bulkApprove').disabled=!n;$('bulkReject').disabled=!n;$('bulkApprove').textContent=n?'Approve '+n:'Approve selected';$('bulkReject').textContent=n?'Reject '+n:'Reject selected';}
  $('selAll').addEventListener('change',function(){document.querySelectorAll('.pick').forEach(function(c){c.checked=$('selAll').checked;});updBulk();});
  $('bulkApprove').addEventListener('click',function(){act(picked(),'approve');});
  $('bulkReject').addEventListener('click',function(){act(picked(),'delete');});

  var confirming=null;
  function act(ids,what){
    if(!ids.length)return;
    if(what==='delete'&&confirming!==ids.join(',')){confirming=ids.join(',');toast('Click Reject/Delete again to confirm removing '+ids.length+' note'+(ids.length>1?'s':'')+'.');setTimeout(function(){confirming=null;},4000);return;}
    confirming=null;
    ids.forEach(function(id){var el=document.querySelector('.note[data-id="'+id+'"]');if(el)el.classList.add('done');});
    var filter='id=in.('+ids.join(',')+')',req;
    if(what==='approve')req=api('notes?'+filter,{method:'PATCH',body:{approved:true}});
    else if(what==='unpublish')req=api('notes?'+filter,{method:'PATCH',body:{approved:false}});
    else req=api('notes?'+filter,{method:'DELETE'});
    req.then(function(){toast(what==='approve'?(ids.length+' note'+(ids.length>1?'s':'')+' approved'):what==='unpublish'?'Taken off the wall':'Removed');return load();})
      .catch(function(err){toast(err.message.slice(0,140));load();});
  }
  function setHidden(id,v,btn){
    btn.disabled=true;
    api('quiz_scores?id=eq.'+id,{method:'PATCH',body:{hidden:v}}).then(function(){toast(v?'Hidden from the leaderboard':'Back on the leaderboard');return load();})
      .catch(function(err){toast(err.message.slice(0,140));btn.disabled=false;});
  }
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){tab=t.dataset.t;render();});});
  $('refresh').addEventListener('click',load);
  $('q').addEventListener('input',render);

  /* ===== boot ===== */
  if(!SUPABASE_URL||!SUPABASE_ANON_KEY||SUPABASE_URL.indexOf('__')===0){show('cfg');return;}
  session=loadSession();
  if(session){start().catch(function(){signOut();});}else show('login');
})();
</script>
</body>
</html>
